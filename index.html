<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Tanu ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;height:100vh;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ffe0ec,#fff4d8);
  color:#5b2942;cursor:pointer;
}
.card{
  text-align:center;padding:42px 28px;width:min(90%,430px);
  background:rgba(255,255,255,.82);border-radius:30px;
  box-shadow:0 15px 50px rgba(120,50,80,.18);
  position:relative;z-index:3;
}
h1{font-size:42px;margin:10px 0;color:#e94b82}
h2{font-size:25px;margin:8px 0 22px}
p{font-size:19px;line-height:1.6}
.tap{margin-top:25px;font-size:15px;opacity:.65;animation:pulse 1.4s infinite}
.flower{position:fixed;bottom:-60px;font-size:35px;animation:rise 5s linear forwards;z-index:2}
.heart{position:fixed;font-size:28px;animation:float 4s ease-out forwards;z-index:4}
@keyframes pulse{50%{transform:scale(1.08);opacity:1}}
@keyframes rise{to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
@keyframes float{to{transform:translateY(-65vh) scale(1.5);opacity:0}}
</style>
</head>
<body onclick="celebrate()">

<div class="card">
  <div style="font-size:58px">🌸🎂🌸</div>
  <h1>Happy Birthday Tanu! 🎉</h1>
  <h2>Lots of Love to You ❤️</h2>
  <p>
    Wishing you lots of happiness,<br>
    beautiful flowers 🌸 and many celebrations! 🥳
  </p>
  <p>May your day be as lovely as you are. 💕</p>
  <div class="tap">✨ Tap anywhere for a little surprise ✨</div>
  <div style="margin-top:20px;font-size:16px">With Lots of Love ❤️<br><b>Satyam</b></div>
</div>

<script>
let busy=false;
function celebrate(){
  if(busy)return;
  busy=true;
  const flowers=["🌸","🌷","🌹","🌺","💐","🌻"];
  const hearts=["❤️","💕","💖","💗","✨","🎉"];
  for(let i=0;i<45;i++){
    const el=document.createElement("div");
    el.className=i%3===0?"heart":"flower";
    el.textContent=(i%3===0?hearts:flowers)[i%6];
    el.style.left=Math.random()*100+"vw";
    el.style.animationDelay=Math.random()*1.5+"s";
    el.style.fontSize=(22+Math.random()*25)+"px";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),6500);
  }
  setTimeout(()=>busy=false,1200);
}
</script>
</body>
</html>
